name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: shell syntax + doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every script
        run: |
          set -e
          for f in build.sh install.sh uninstall.sh; do
            printf '%-14s ' "$f"
            bash -n "$f"
            echo OK
          done

      - name: shellcheck (warnings only, non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning build.sh install.sh uninstall.sh

      - name: local markdown links resolve
        run: python3 .github/check_links.py
